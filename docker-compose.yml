services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    cpus: 0.25
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: VelocityRig
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      INERTIA_SSR_ENABLED: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-delovna_praksa}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}
      SESSION_DRIVER: database
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    command:
      - sh
      - -c
      - php artisan migrate --force && exec php artisan serve --host=0.0.0.0 --port=8000
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  db:
    image: mysql:8.0
    cpus: 0.25
    mem_limit: 256m
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-delovna_praksa}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment}
    volumes:
      - ./.stack-data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
