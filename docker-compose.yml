services:
  app:
    image: filippopovski/velocityrig:v3
    cpus: 0.25
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: VelocityRig
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      INERTIA_SSR_ENABLED: "false"
      RUN_DATABASE_SEEDER: ${RUN_DATABASE_SEEDER:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    command:
      - sh
      - -c
      - php artisan migrate --force && if [ "$$RUN_DATABASE_SEEDER" = "true" ]; then php artisan db:seed --force; fi && exec php artisan serve --host=0.0.0.0 --port=8000
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8000/') === false ? 1 : 0);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  db:
    image: mysql:8.0
    cpus: 0.15
    mem_limit: 256m
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./.stack-data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
